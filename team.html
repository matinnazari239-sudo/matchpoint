
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اطلاعات تیم | MatchPoint</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #071629;
      color: white;
      font-family: Arial, sans-serif;
    }

    .team-card {
      max-width: 700px;
      margin: 50px auto;
      padding: 30px;
      background: #10233f;
      border-radius: 18px;
      text-align: center;
    }

    img {
      width: 110px;
      height: 110px;
      object-fit: contain;
    }

    h1 {
      color: #60a5fa;
    }

    a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="team-card">
    <img id="team-crest" src="" alt="نشان تیم">
    <h1 id="team-name">در حال دریافت اطلاعات تیم...</h1>
    <p id="team-country"></p>
    <p id="team-founded"></p>
    <a href="index.html">بازگشت به صفحه اصلی</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const teamId = params.get("id");

    async function loadTeam() {
      if (!teamId) {
        document.getElementById("team-name").textContent =
          "تیمی انتخاب نشده است";
        return;
      }

      try {
        const response = await fetch(
          `/.netlify/functions/football?team=${teamId}`
        );

        if (!response.ok) throw new Error();

        const team = await response.json();

        document.getElementById("team-name").textContent =
          team.name || "نامشخص";

        document.getElementById("team-crest").src =
          team.crest || "";

        document.getElementById("team-country").textContent =
          "کشور: " + (team.area?.name || "نامشخص");

        document.getElementById("team-founded").textContent =
          "سال تأسیس: " + (team.founded || "نامشخص");

      } catch (error) {
        document.getElementById("team-name").textContent =
          "اطلاعات تیم دریافت نشد.";
      }
    }

    loadTeam();
  </script>

</body>
</html>
